[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "espflash flash --partition-table partitions.csv --flash-size 16mb --monitor"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
ESP_IDF_SDKCONFIG_DEFAULTS = { value = "sdkconfig.defaults.nerdqx", relative = true }
