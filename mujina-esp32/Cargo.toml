[package]
name = "mujina-esp32"
version = "0.1.0"
edition = "2021"
description = "NerdQX (ESP32-S3R8) standalone embedded firmware: portable pins, power, tuner, HUD logic"
publish = false

# Standalone: not part of the parent mujina workspace.
[workspace]

[[bin]]
name = "mujina-esp32"
path = "src/main.rs"
required-features = ["esp32s3"]

[features]
default = []
# Enables the ESP-IDF target glue (needs the xtensa-esp32s3-espidf toolchain).
esp32s3 = ["dep:esp-idf-svc", "dep:embedded-svc", "dep:log"]

[dependencies]
esp-idf-svc = { version = "0.51", optional = true }
embedded-svc = { version = "0.28", optional = true }
log = { version = "0.4", optional = true }

[build-dependencies]
embuild = "0.33"
